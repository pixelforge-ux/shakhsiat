        }

        .floating {

        }

            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .scroll-hide::-webkit-scrollbar { display: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.96); }
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-in forwards; }

                { text: "دوستانم مرا فردی صبور و مقاوم می‌دانند.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "معتقدم هر اتفاقی دلیلی دارد و از آن درس می‌گیرم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "حتی در اوج ناامیدی، هدف‌هایم را رها نمی‌کنم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "می‌توانم احساسات منفی‌ام را مدیریت کنم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "از تغییرات ناگهانی در زندگی نمی‌ترسم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "درخواست کمک از دیگران را نشانه ضعف نمی‌دانم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] }
            ], results: [
                { id: 'res-low', range: [0, 20], title: "شکننده", desc: "نیاز دارید روی مهارت‌های مقابله‌ای و اعتماد به نفس خود کار کنید." },
                { id: 'res-high', range: [21, 40], title: "فولادین", desc: "شما تاب‌آوری بسیار بالایی دارید و در برابر طوفان‌های زندگی مقاوم هستید." }
            ]},
            { id: 17, title: "کنترل خشم", icon: "Flame", questions: [
                { text: "وقتی عصبانی می‌شوم، فریاد می‌زنم یا وسایل را می‌کوبم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "خیلی زود از کوره در می‌روم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "بعد از عصبانیت، از حرف‌هایم پشیمان می‌شوم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "می‌توانم در اوج خشم، سکوت کنم و محیط را ترک کنم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "در ترافیک یا صف، به سرعت عصبی می‌شوم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "کینه دیگران را تا مدت‌ها در دل نگه می‌دارم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "هنگام عصبانیت، به دیگران توهین می‌کنم.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "روش‌های آرام‌سازی (مانند نفس عمیق) را بلدم و استفاده می‌کنم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] },
                { text: "فکر می‌کنم دیگران عمداً مرا عصبانی می‌کنند.", options: [{ text: "بله", score: 0 }, { text: "خیر", score: 4 }] },
                { text: "می‌توانم خشمم را با کلمات محترمانه بیان کنم.", options: [{ text: "بله", score: 4 }, { text: "خیر", score: 0 }] }
            ], results: [
                { id: 'ang-low', range: [0, 20], title: "نیاز به مدیریت خشم", desc: "خشم شما ممکن است به روابط و سلامتتان آسیب بزند." },
                { id: 'ang-high', range: [21, 40], title: "صبور و مسلط", desc: "شما به خوبی می‌توانید هیجانات خود را در شرایط دشوار کنترل کنید." }
            ]}
        ];

        // --- App Component ---
        const App = () => {
            const [screen, setScreen] = useState('list'); // 'list', 'quiz', 'result', 'history'
            const [currentTest, setCurrentTest] = useState(null);
            const [answers, setAnswers] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [finalScore, setFinalScore] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const [stats, setStats] = useState({});
            const [userHistory, setUserHistory] = useState([]);

            useEffect(() => {
                const savedStats = localStorage.getItem('psych_test_stats') || '{}';
                setStats(JSON.parse(savedStats));
                
                const savedHistory = localStorage.getItem('psych_test_history') || '[]';
                setUserHistory(JSON.parse(savedHistory));

                const handlePopState = (e) => {
                    if (e.state && e.state.screen) setScreen(e.state.screen);
                    else setScreen('list');
                };
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, []);

            const playSound = (src) => {
                new Audio(src).play().catch(() => {});
            };

            const startTest = (test) => {
                playSound('click.mp3');
                setCurrentTest(test);
                setCurrentQuestionIndex(0);
                setAnswers([]);
                setSelectedOption(null);
                window.history.pushState({ screen: 'quiz' }, '');
                setScreen('quiz');
            };

            const handleAnswer = (index, score) => {
                if (isTransitioning) return;
                playSound('click.mp3');
                setSelectedOption(index);
                setIsTransitioning(true);

                setTimeout(() => {
                    const newAnswers = [...answers, score];
                    setAnswers(newAnswers);

                    if (currentQuestionIndex < currentTest.questions.length - 1) {
                        setCurrentQuestionIndex(currentQuestionIndex + 1);
                        setSelectedOption(null);
                        setIsTransitioning(false);
                    } else {
                        const total = newAnswers.reduce((a, b) => a + b, 0);
                        setFinalScore(total);
                        const result = currentTest.results.find(r => total >= r.range[0] && total <= r.range[1]) || currentTest.results[0];
                        
                        // Update stats & history
                        const newStats = { ...stats, [result.id]: (stats[result.id] || 0) + 1 };
                        setStats(newStats);
                        localStorage.setItem('psych_test_stats', JSON.stringify(newStats));

                        const entry = { title: currentTest.title, result: result.title, date: new Date().toLocaleDateString('fa-IR') };
                        const newHistory = [entry, ...userHistory].slice(0, 15);
                        setUserHistory(newHistory);
                        localStorage.setItem('psych_test_history', JSON.stringify(newHistory));

                        playSound('complete.mp3');
                        window.history.replaceState({ screen: 'result' }, '');
                        setScreen('result');
                        setIsTransitioning(false);
                    }
                }, 400);
            };

            const goBack = () => {
                if (isTransitioning || currentQuestionIndex === 0) return;
                playSound('click.mp3');
                setIsTransitioning(true);
                setTimeout(() => {
                    setAnswers(answers.slice(0, -1));
                    setCurrentQuestionIndex(currentQuestionIndex - 1);
                    setSelectedOption(null);
                    setIsTransitioning(false);
                }, 300);
            };

            const getResult = () => {
                if (!currentTest) return null;
                return currentTest.results.find(r => finalScore >= r.range[0] && finalScore <= r.range[1]) || currentTest.results[0];
            };

            const renderIcon = (iconName, size = 24) => {
                const Icon = LucideIcons[iconName] || LucideIcons.FileQuestion;
                return html`<${Icon} size=${size} />`;
            };

            const ThreeScene = () => {
                const mount = useRef(null);
                useEffect(() => {
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    mount.current.appendChild(renderer.domElement);
                    const mat = new THREE.MeshPhongMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.12, flatShading: true });
                    const geoms = [new THREE.IcosahedronGeometry(1), new THREE.TorusGeometry(0.5, 0.2)];
                    const meshes = Array.from({ length: 18 }, () => {
                        const m = new THREE.Mesh(geoms[Math.floor(Math.random() * 2)], mat);
                        m.position.set((Math.random() - 0.5) * 15, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 8);
                        m.userData = { ry: Math.random() * 0.02, speed: -0.01 - Math.random() * 0.015 };
                        scene.add(m); return m;
                    });
                    scene.add(new THREE.DirectionalLight(0xffffff, 1), new THREE.AmbientLight(0xffffff, 0.6));
                    camera.position.z = 10;
                    const loop = () => {
                        meshes.forEach(m => {
                            m.rotation.y += m.userData.ry; m.position.y += m.userData.speed;
                            if (m.position.y < -15) m.position.y = 15;
                        });
                        renderer.render(scene, camera); requestAnimationFrame(loop);
                    };
                    loop();
                    return () => { if (mount.current) mount.current.innerHTML = ''; };
                }, []);
                return html`<div ref=${mount} id="bg-canvas"></div>`;
            };

            return html`
                <div className="max-w-md mx-auto h-screen flex flex-col relative text-slate-800">
                    <${ThreeScene} />
                    
                    <header className="glass p-4 shadow-sm z-30 flex items-center justify-between border-b border-white/30">
                        <div className="flex items-center gap-1">
                            ${screen !== 'list' && html`
                                <button onClick=${() => window.history.back()} className="p-2 text-blue-600 active:scale-90 transition-transform">
                                    <${LucideIcons.ChevronRight} size=${28} />
                                </button>
                            `}
                            <button onClick=${() => { playSound('click.mp3'); setScreen('history'); window.history.pushState({ screen: 'history' }, ''); }} className="p-2 text-slate-500 active:scale-90">
                                <${LucideIcons.History} size=${22} />
                            </button>
                        </div>
                        <h1 className="text-sm font-black text-slate-700 truncate max-w-[180px]">
                            ${screen === 'list' ? 'آزمون‌های شخصیت' : screen === 'history' ? 'تاریخچه من' : currentTest?.title}
                        </h1>
                        <div className="w-10"></div>
                    </header>

                    <main className="flex-grow overflow-y-auto scroll-hide p-4 z-20">
                        ${screen === 'list' && html`
                            <div className="grid grid-cols-1 gap-4 pb-20 fade-in">
                                ${testsData.map((t, i) => html`
                                    <div key=${t.id} onClick=${() => startTest(t)} className="glass p-4 rounded-3xl card-3d flex items-center gap-4 cursor-pointer hover:bg-white/60">
                                        <div className="text-[10px] font-black text-slate-300 w-4">${i + 1}</div>
                                        <div className="bg-blue-600/10 p-3 rounded-2xl text-blue-600">
                                            ${renderIcon(t.icon, 24)}
                                        </div>
                                        <div className="flex-grow">
                                            <h2 className="font-bold text-slate-700 text-sm">${t.title}</h2>
                                            <p className="text-[10px] text-slate-400">${t.questions.length} سوال</p>
                                        </div>
                                        <${LucideIcons.ChevronLeft} className="text-slate-300" size=${16} />
                                    </div>
                                `)}
                            </div>
                        `}

                        ${screen === 'history' && html`
                            <div className="fade-in space-y-3 pb-10">
                                ${userHistory.length === 0 ? html`<div className="text-center py-20 opacity-40 font-bold">هنوز آزمونی انجام نداده‌اید</div>` : 
                                userHistory.map((h, i) => html`
                                    <div key=${i} className="glass p-4 rounded-2xl flex justify-between items-center border-white/40">
                                        <div>
                                            <div className="text-[11px] font-black text-slate-700">${h.title}</div>
                                            <div className="text-[10px] text-blue-600 font-bold mt-1">${h.result}</div>
                                        </div>
                                        <div className="text-[9px] text-slate-400 font-medium">${h.date}</div>
                                    </div>
                                `)}
                            </div>
                        `}

                        ${screen === 'quiz' && currentTest && html`
                            <div key=${currentQuestionIndex} className=${`h-full flex flex-col ${isTransitioning ? 'fade-out' : 'fade-in'}`}>
                                <div className="mb-4">
                                    <div className="flex justify-between text-[11px] mb-2 font-black text-blue-600">
                                        <span>سوال ${currentQuestionIndex + 1} از ${currentTest.questions.length}</span>
                                        <span>${Math.round(((currentQuestionIndex + 1) / currentTest.questions.length) * 100)}%</span>
                                    </div>
                                    <div className="w-full bg-white/40 h-2 rounded-full overflow-hidden border border-white/40">
                                        <div className="bg-blue-500 h-full transition-all duration-500" style=${{ width: `${((currentQuestionIndex + 1) / currentTest.questions.length) * 100}%` }}></div>
                                    </div>
                                </div>

                                <div className="glass p-8 rounded-[2.5rem] mb-6 shadow-sm min-h-[140px] flex items-center justify-center text-center border-white floating">
                                    <h3 className="text-lg font-black leading-relaxed text-slate-800">${currentTest.questions[currentQuestionIndex].text}</h3>
                                </div>

                                <div className="space-y-3">
                                    ${currentTest.questions[currentQuestionIndex].options.map((opt, idx) => html`
                                        <button key=${idx} onClick=${() => handleAnswer(idx, opt.score)}
                                            className=${`w-full p-4 glass rounded-2xl text-right font-bold transition-all border-2 ${selectedOption === idx ? 'bg-blue-600 text-white border-blue-400' : 'border-transparent text-slate-700'}`}
                                        >
                                            ${opt.text}
                                        </button>
                                    `)}
                                    
                                    ${currentQuestionIndex > 0 && html`
                                        <button onClick=${goBack} className="w-full mt-4 p-4 btn-blue-soft rounded-2xl font-black flex items-center justify-center gap-2 transition-all active:scale-95">
                                            <${LucideIcons.RotateCcw} size=${16} />
                                            سوال قبلی
                                        </button>
                                    `}
                                </div>
                            </div>
                        `}

                        ${screen === 'result' && html`
                            <div className="flex flex-col items-center py-6 fade-in text-center">
                                <div className="bg-yellow-400 p-6 rounded-full mb-6 text-white shadow-xl floating">
                                    <${LucideIcons.Trophy} size=${40} />
                                </div>
                                <div className="glass p-8 rounded-[2.5rem] w-full border-white shadow-sm mb-6">
                                    <h3 className="text-lg font-black text-blue-600 mb-4">${getResult()?.title}</h3>
                                    <p className="text-slate-500 leading-relaxed text-sm font-medium">${getResult()?.desc}</p>
                                </div>

                                <!-- Statistics Chart -->
                                <div className="glass w-full p-6 rounded-3xl border-white/40 mb-8">
                                    <div className="flex items-center gap-2 mb-4 text-slate-600">
                                        <${LucideIcons.BarChart3} size=${18} />
                                        <h4 className="text-[12px] font-black">توزیع پاسخ‌های کاربران در این آزمون:</h4>
                                    </div>
                                    <div className="space-y-4">
                                        ${(() => {
                                            const MIN_TOTAL = 124950;
                                            const realCounts = currentTest.results.map(res => stats[res.id] || 0);
                                            const realTotal = realCounts.reduce((a,b) => a + b, 0);

                                            let adjustedCounts;
                                            if (realTotal === 0) {
                                                // distribute equally if no real votes
                                                const base = Math.floor(MIN_TOTAL / currentTest.results.length);
                                                adjustedCounts = realCounts.map(() => base);
                                                let rem = MIN_TOTAL - adjustedCounts.reduce((a,b) => a + b, 0);
                                                let i = 0;
                                                while (rem > 0) { adjustedCounts[i % adjustedCounts.length]++; rem--; i++; }
                                            } else if (realTotal >= MIN_TOTAL) {
                                                adjustedCounts = [...realCounts];
                                            } else {
                                                // distribute the deficit proportionally to existing counts
                                                const deficit = MIN_TOTAL - realTotal;
                                                adjustedCounts = realCounts.map(c => {
                                                    // proportional share; if count is zero give a tiny share proportional to 1
                                                    return c + Math.round(deficit * (c > 0 ? c : 1) / (realCounts.reduce((acc, val) => acc + (val > 0 ? val : 1), 0)));
                                                });
                                                // fix rounding to match MIN_TOTAL exactly
                                                let adjTotal = adjustedCounts.reduce((a,b) => a + b, 0);
                                                let diff = MIN_TOTAL - adjTotal;
                                                let idx = 0;
                                                while (diff !== 0) {
                                                    adjustedCounts[idx % adjustedCounts.length] += diff > 0 ? 1 : -1;
                                                    diff += diff > 0 ? -1 : 1;
                                                    idx++;
                                                }
                                            }

                                            return currentTest.results.map((r, index) => {
                                                const count = stats[r.id] || 0;
                                                const displayCount = adjustedCounts[index];
                                                const percent = Math.round((displayCount / MIN_TOTAL) * 100);
                                                const isUserResult = getResult()?.id === r.id;

                                                return html`
                                                    <div key=${r.id} className="w-full text-right">
                                                        <div className="flex justify-between text-[10px] mb-1.5 font-bold ${isUserResult ? 'text-blue-600' : 'text-slate-500'}">
                                                            <span>${r.title} ${isUserResult && '(نتیجه شما)'}</span>
                                                            <span>${count} نفر (${percent}٪)</span>
                                                        </div>
                                                        <div className="w-full bg-slate-200/50 h-2.5 rounded-full overflow-hidden border border-white/20">
                                                            <div 
                                                                className=${`h-full transition-all duration-1000 ease-out ${isUserResult ? 'bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]' : 'bg-slate-400'}`} 
                                                                style=${{ width: `${percent}%` }}
                                                            ></div>
                                                        </div>
                                                    </div>
                                                `;
                                            });
                                        })()}
                                    </div>
                                </div>
                                
                                <button onClick=${() => window.history.back()} className="bg-slate-800 text-white w-full py-4 rounded-2xl font-black shadow-lg active:scale-95 transition-all">بازگشت به لیست</button>
                            </div>
                        `}
                    </main>
                </div>
            `;
        };

        const root = createRoot(document.getElementById('root'));
        root.render(html`<${App} />`);
    </script>
</body>
</html>
